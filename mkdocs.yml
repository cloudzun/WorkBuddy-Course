# WorkBuddy 效率进阶实训课程 - 文档站点配置
site_name: WorkBuddy 效率进阶实训课程
site_description: 教材（9 章 + 附录）+ 实验手册（38 个实验）+ 授课课件，基于官方文档逐条核验，实操提效
site_url: https://cloudzun.github.io/WorkBuddy-Course/
repo_url: https://github.com/cloudzun/WorkBuddy-Course
repo_name: cloudzun/WorkBuddy-Course
edit_uri: ""

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

extra_css:
  - assets/extra.css

extra:
  generator: false

copyright: Copyright &copy; 2026 · CC BY-NC-ND 4.0 · WorkBuddy 效率进阶实训课程

plugins:
  - search:
      lang:
        - zh
        - en
  - exclude:
      glob:
        - ".git*"
        - "ppt/**"
        - "*.json"
        - "*.js"
        - "*.ps1"

docs_dir: docs

nav:
  - 首页: index.md
  - 课程大纲: 课程大纲.md
  - 网页版课件: html/index.html
  - 教材:
      - 第 1 章 产品与基础入门: textbook/ch01-product-fundamentals.md
      - 第 2 章 任务创建与结果管理: textbook/ch02-task-creation-and-results.md
      - 第 3 章 灵感模块: textbook/ch03-inspiration.md
      - 第 4 章 技能、专家与专家团: textbook/ch04-skills-experts-and-teams.md
      - 第 5 章 连接器与资料库: textbook/ch05-connectors-and-library.md
      - 第 6 章 模型配置: textbook/ch06-models.md
      - 第 7 章 助理连接配置: textbook/ch07-assistant-channels.md
      - 第 8 章 自动化: textbook/ch08-automation.md
      - 第 9 章 典型办公场景综合实战与 OPC 一人公司: textbook/ch09-office-scenarios-and-opc.md
      - 教材↔实验映射: textbook/COURSE-OUTLINE.md
      - 术语表: textbook/GLOSSARY.md
      - 编写规范: textbook/TEXTBOOK-STYLE-GUIDE.md
      - 附录 A 官方文档对照: textbook/appendix-official-docs-reference.md
  - 实验手册:
      - 实验 1.1-1.4 产品与基础入门: labs/ch01-labs.md
      - 实验 2.1-2.5 任务创建与结果管理: labs/ch02-labs.md
      - 实验 3.1-3.3 灵感模块: labs/ch03-labs.md
      - 实验 4.1-4.6 技能·专家·专家团: labs/ch04-labs.md
      - 实验 5.1-5.4 连接器与资料库: labs/ch05-labs.md
      - 实验 6.1-6.5 模型配置: labs/ch06-labs.md
      - 实验 7.1-7.6 助理连接配置: labs/ch07-labs.md
      - 实验 8.1-8.4 自动化: labs/ch08-labs.md
      - 综合演练 咖啡品牌季度经营分析: labs/ch09-labs.md
      - 实验手册说明: labs/README.md