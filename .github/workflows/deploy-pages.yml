name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs & Material
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-exclude
      - name: Prepare docs (aggregate single-source markdown)
        run: |
          mkdir -p docs/textbook docs/labs docs/assets docs/html
          cp docs-index.md docs/index.md
          cp 课程大纲.md docs/
          cp textbook/*.md docs/textbook/
          cp labs/*.md docs/labs/
          cp assets/extra.css docs/assets/extra.css
          cp ppt/html/*.html docs/html/
      - name: Build site
        run: mkdocs build --strict
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4